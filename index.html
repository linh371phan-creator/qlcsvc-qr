<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLCSVC-QR · Quản lý cơ sở vật chất trường học</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#1B2340;
    --ink-soft:#4A5170;
    --paper:#F3F1EC;
    --card:#FFFFFF;
    --line:#DCD8CC;
    --tag-amber:#C9862A;
    --ok:#2F7D5C;
    --ok-bg:#E4F2EB;
    --bad:#B94A3C;
    --bad-bg:#FBE9E6;
    --warn:#B4842A;
    --warn-bg:#FBF0DD;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --disp: 'Space Grotesk', 'Inter', sans-serif;
    --body: 'Inter', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);}
  #app{max-width:1100px;margin:0 auto;padding:20px 20px 80px;}

  /* HEADER */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:42px;height:42px;border-radius:9px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:24px;height:24px;}
  .brand h1{font-family:var(--disp);font-size:18px;margin:0;font-weight:700;letter-spacing:-0.01em;}
  .brand p{margin:0;font-size:12px;color:var(--ink-soft);font-family:var(--mono);letter-spacing:0.02em;}
  .role-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
  .role-switch button{border:none;background:transparent;padding:8px 14px;border-radius:8px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .role-switch button.active{background:var(--ink);color:#fff;}

  /* NAV TABS */
  nav.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;}
  nav.tabs button{border:none;background:transparent;padding:10px 14px;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--tag-amber);}
  nav.tabs button .count{font-family:var(--mono);font-size:11px;background:var(--line);color:var(--ink);padding:1px 6px;border-radius:20px;margin-left:6px;}

  /* TOOLBAR */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text], .toolbar select{font-family:var(--body);font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);}
  .toolbar input[type=text]{flex:1;min-width:180px;}
  .btn{font-family:var(--body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--ink);}
  .btn.danger{background:var(--bad);border-color:var(--bad);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ASSET GRID = tag-style cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .tag-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:transform .12s, box-shadow .12s;}
  .tag-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(27,35,64,.08);}
  .tag-card::before{content:"";position:absolute;left:-5px;top:22px;width:10px;height:10px;background:var(--paper);border:1px solid var(--line);border-radius:50%;}
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tag-id{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
  .status-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .status-ready{background:var(--ok-bg);color:var(--ok);}
  .status-broken{background:var(--bad-bg);color:var(--bad);}
  .status-fixing{background:var(--warn-bg);color:var(--warn);}
  .tag-card h3{font-family:var(--disp);font-size:16px;margin:10px 0 4px;font-weight:600;}
  .tag-card .loc{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .tag-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);}
  .tag-foot .date{font-size:11px;font-family:var(--mono);color:var(--ink-soft);}
  .mini-qr{width:34px;height:34px;background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .mini-qr img,.mini-qr canvas{width:100%;height:100%;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty h3{font-family:var(--disp);color:var(--ink);}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(27,35,64,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--card);border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;}
  .modal h2{font-family:var(--disp);font-size:19px;margin:0 0 4px;}
  .modal .sub{font-size:12px;color:var(--ink-soft);font-family:var(--mono);margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink-soft);}
  .field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;font-family:var(--body);font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);}
  .field textarea{resize:vertical;min-height:70px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .close-x{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}

  /* DETAIL MODAL */
  .detail-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;background:var(--paper);border-radius:10px;margin-bottom:16px;}
  .detail-qr-wrap .qr-box{background:#fff;padding:10px;border-radius:8px;border:1px solid var(--line);}
  .detail-qr-wrap .link{font-family:var(--mono);font-size:11px;color:var(--ink-soft);word-break:break-all;text-align:center;}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-bottom:16px;}
  .kv dt{color:var(--ink-soft);font-weight:600;}
  .kv dd{margin:0;}
  .report-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .report-item .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-bottom:4px;}
  .report-item img{max-width:100%;border-radius:6px;margin-top:6px;}
  .badge-new{background:var(--bad-bg);color:var(--bad);font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;}
  .badge-done{background:var(--ok-bg);color:var(--ok);font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;}

  .hint{background:var(--warn-bg);border:1px solid #EAD6A2;color:#7A5A16;font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:16px;line-height:1.5;}
  .file-drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .file-drop img{max-width:100%;max-height:120px;border-radius:6px;margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- STORAGE HELPERS ---------------- */
const SHARED = true; // shared across everyone using this demo
async function dbGet(key){ try{ const r = await window.storage.get(key, SHARED); return r ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function dbSet(key, val){ try{ await window.storage.set(key, JSON.stringify(val), SHARED); }catch(e){ console.error('storage set failed', e); } }

let state = {
  role: 'admin', // 'admin' | 'user'
  tab: 'assets',
  assets: [],
  reports: [],
  search: '',
  statusFilter: 'all',
  modal: null, // {type:'add'|'edit'|'detail'|'scan', data}
};

const uid = (p='A') => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2,5);
const todayStr = () => new Date().toISOString().slice(0,10);

/* ---------------- INIT / SEED ---------------- */
async function init(){
  let assets = await dbGet('assets:all');
  let reports = await dbGet('reports:all');
  if(!assets){
    assets = [
      {id:'TB-0001', name:'Máy chiếu Optoma X400', location:'Phòng A203', purchaseDate:'2023-08-10', status:'ready'},
      {id:'TB-0002', name:'Điều hòa Daikin 2 chiều', location:'Phòng A203', purchaseDate:'2022-05-14', status:'fixing'},
      {id:'TB-0003', name:'Bàn thí nghiệm Hóa số 3', location:'Phòng thực hành B105', purchaseDate:'2021-09-01', status:'broken'},
    ];
    await dbSet('assets:all', assets);
  }
  if(!reports){ reports = []; await dbSet('reports:all', reports); }
  state.assets = assets;
  state.reports = reports;
  render();
}

async function saveAssets(){ await dbSet('assets:all', state.assets); }
async function saveReports(){ await dbSet('reports:all', state.reports); }

/* ---------------- BASE URL for QR (deep link) ---------------- */
function baseUrl(){
  // When this file is deployed to real hosting, location.href works as a real scannable link.
  return location.href.split('#')[0].split('?')[0];
}
function assetLink(assetId){
  return `${baseUrl()}?asset=${encodeURIComponent(assetId)}`;
}

/* ---------------- STATUS META ---------------- */
const STATUS_META = {
  ready:{label:'Sẵn sàng', cls:'status-ready'},
  broken:{label:'Hỏng', cls:'status-broken'},
  fixing:{label:'Đang sửa', cls:'status-fixing'},
};

/* ---------------- RENDER ---------------- */
function render(){
  const root = document.getElementById('app');
  root.innerHTML = `
    ${renderHeader()}
    ${renderTabs()}
    ${state.tab==='assets' ? renderAssetsView() : renderReportsView()}
  `;
  attachHeaderEvents();
  if(state.tab==='assets') attachAssetsEvents(); else attachReportsEvents();
  renderMiniQrs();
  if(state.modal) renderModal();
}

function renderHeader(){
  return `
  <header class="top">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#F3F1EC" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="#F3F1EC" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="#F3F1EC" stroke-width="1.6"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM18 18h3v3h-3z" fill="#F3F1EC"/></svg>
      </div>
      <div>
        <h1>QLCSVC · QR</h1>
        <p>HỆ THỐNG QUẢN LÝ CSVC TRƯỜNG HỌC</p>
      </div>
    </div>
    <div class="role-switch">
      <button data-role="admin" class="${state.role==='admin'?'active':''}">Ban quản lý</button>
      <button data-role="user" class="${state.role==='user'?'active':''}">Giáo viên / Sinh viên</button>
    </div>
  </header>`;
}

function renderTabs(){
  const newCount = state.reports.filter(r=>r.status==='new').length;
  return `
  <nav class="tabs">
    <button data-tab="assets" class="${state.tab==='assets'?'active':''}">Danh sách thiết bị <span class="count">${state.assets.length}</span></button>
    ${state.role==='admin' ? `<button data-tab="reports" class="${state.tab==='reports'?'active':''}">Báo hỏng ${newCount>0?`<span class="count">${newCount} mới</span>`:''}</button>` : ''}
  </nav>`;
}

function filteredAssets(){
  return state.assets.filter(a=>{
    const okSearch = (a.name+a.location+a.id).toLowerCase().includes(state.search.toLowerCase());
    const okStatus = state.statusFilter==='all' || a.status===state.statusFilter;
    return okSearch && okStatus;
  });
}

function renderAssetsView(){
  const list = filteredAssets();
  return `
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Tìm theo tên, mã, vị trí..." value="${escAttr(state.search)}">
    <select id="statusFilter">
      <option value="all" ${state.statusFilter==='all'?'selected':''}>Tất cả trạng thái</option>
      <option value="ready" ${state.statusFilter==='ready'?'selected':''}>Sẵn sàng</option>
      <option value="broken" ${state.statusFilter==='broken'?'selected':''}>Hỏng</option>
      <option value="fixing" ${state.statusFilter==='fixing'?'selected':''}>Đang sửa</option>
    </select>
    ${state.role==='admin' ? `<button class="btn" id="addAssetBtn">+ Thêm thiết bị</button>` : `<button class="btn secondary" id="simScanBtn">📷 Mô phỏng quét QR</button>`}
  </div>
  ${list.length===0 ? `<div class="empty"><h3>Chưa có thiết bị nào</h3><p>${state.role==='admin'?'Bấm "Thêm thiết bị" để bắt đầu.':'Không tìm thấy thiết bị phù hợp.'}</p></div>` : `
  <div class="grid">
    ${list.map(a=>`
      <div class="tag-card" data-id="${a.id}">
        <div class="tag-top">
          <span class="tag-id">${a.id}</span>
          <span class="status-pill ${STATUS_META[a.status].cls}">${STATUS_META[a.status].label}</span>
        </div>
        <h3>${escHtml(a.name)}</h3>
        <p class="loc">📍 ${escHtml(a.location)}</p>
        <div class="tag-foot">
          <span class="date">Mua: ${a.purchaseDate}</span>
          <div class="mini-qr" id="mqr-${a.id}"></div>
        </div>
      </div>
    `).join('')}
  </div>`}
  `;
}

function renderReportsView(){
  const list = [...state.reports].sort((a,b)=>b.ts-a.ts);
  return `
  ${list.length===0 ? `<div class="empty"><h3>Chưa có báo cáo hỏng hóc nào</h3><p>Khi người dùng quét QR và gửi báo cáo, nó sẽ hiện ở đây.</p></div>` : `
  <div class="grid" style="grid-template-columns:1fr;">
    ${list.map(r=>{
      const asset = state.assets.find(a=>a.id===r.assetId);
      return `
      <div class="tag-card" style="cursor:default;">
        <div class="tag-top">
          <span class="tag-id">${r.assetId} — ${escHtml(asset?asset.name:'(thiết bị đã xoá)')}</span>
          <span class="${r.status==='new'?'badge-new':'badge-done'}">${r.status==='new'?'MỚI':'ĐÃ XỬ LÝ'}</span>
        </div>
        <p style="font-size:13.5px;margin:10px 0 4px;">${escHtml(r.description)}</p>
        <p style="font-size:11.5px;font-family:var(--mono);color:var(--ink-soft);margin:0 0 8px;">Người báo: ${escHtml(r.reporter||'Ẩn danh')} · ${new Date(r.ts).toLocaleString('vi-VN')}</p>
        ${r.photo ? `<img src="${r.photo}" style="max-width:220px;border-radius:8px;display:block;margin-bottom:10px;">` : ''}
        ${r.status==='new' ? `<button class="btn secondary" data-resolve="${r.id}" style="font-size:12px;padding:6px 12px;">✓ Đánh dấu đã xử lý</button>` : ''}
      </div>`;
    }).join('')}
  </div>`}
  `;
}

/* ---------------- MINI QR RENDER (list thumbnails) ---------------- */
function renderMiniQrs(){
  filteredAssets().forEach(a=>{
    const el = document.getElementById('mqr-'+a.id);
    if(el && !el.dataset.done){
      el.dataset.done='1';
      new QRCode(el, {text: assetLink(a.id), width:60, height:60, correctLevel: QRCode.CorrectLevel.M});
    }
  });
}

/* ---------------- HEADER EVENTS ---------------- */
function attachHeaderEvents(){
  document.querySelectorAll('.role-switch button').forEach(b=>{
    b.onclick = ()=>{ state.role=b.dataset.role; state.tab='assets'; render(); };
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; render(); };
  });
}

/* ---------------- ASSETS TAB EVENTS ---------------- */
function attachAssetsEvents(){
  const s = document.getElementById('searchInput');
  if(s) s.oninput = (e)=>{ state.search=e.target.value; render(); document.getElementById('searchInput').focus(); document.getElementById('searchInput').setSelectionRange(state.search.length,state.search.length); };
  const f = document.getElementById('statusFilter');
  if(f) f.onchange = (e)=>{ state.statusFilter=e.target.value; render(); };
  const addBtn = document.getElementById('addAssetBtn');
  if(addBtn) addBtn.onclick = ()=>{ state.modal={type:'add'}; render(); };
  const scanBtn = document.getElementById('simScanBtn');
  if(scanBtn) scanBtn.onclick = ()=>{ state.modal={type:'pickscan'}; render(); };
  document.querySelectorAll('.tag-card').forEach(c=>{
    c.onclick = ()=>{
      const a = state.assets.find(x=>x.id===c.dataset.id);
      state.modal = {type: state.role==='admin' ? 'detail' : 'view', data:a};
      render();
    };
  });
}

function attachReportsEvents(){
  document.querySelectorAll('[data-resolve]').forEach(b=>{
    b.onclick = async ()=>{
      const r = state.reports.find(x=>x.id===b.dataset.resolve);
      if(r){ r.status='done'; await saveReports(); render(); }
    };
  });
}

/* ---------------- MODALS ---------------- */
function renderModal(){
  const m = state.modal;
  let html = '';
  if(m.type==='add' || m.type==='edit') html = assetFormModal(m);
  else if(m.type==='detail') html = detailModal(m.data, true);
  else if(m.type==='view') html = detailModal(m.data, false);
  else if(m.type==='pickscan') html = pickScanModal();
  else if(m.type==='report') html = reportFormModal(m.data);

  const wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = html;
  wrap.onclick = (e)=>{ if(e.target===wrap){ state.modal=null; render(); } };
  document.getElementById('app').appendChild(wrap);
  bindModalEvents(m);
}

function assetFormModal(m){
  const a = m.data || {id: uid('TB-'), name:'', location:'', purchaseDate: todayStr(), status:'ready'};
  return `
  <div class="modal">
    <button class="close-x" data-close>×</button>
    <h2>${m.type==='add'?'Thêm thiết bị mới':'Sửa thông tin thiết bị'}</h2>
    <p class="sub">Mã QR sẽ tự động sinh dựa trên mã thiết bị</p>
    <div class="field"><label>Mã thiết bị</label><input type="text" id="f-id" value="${escAttr(a.id)}" ${m.type==='edit'?'disabled':''}></div>
    <div class="field"><label>Tên thiết bị</label><input type="text" id="f-name" value="${escAttr(a.name)}" placeholder="VD: Máy chiếu Optoma X400"></div>
    <div class="field"><label>Vị trí</label><input type="text" id="f-location" value="${escAttr(a.location)}" placeholder="VD: Phòng A203"></div>
    <div class="field"><label>Ngày mua</label><input type="date" id="f-date" value="${a.purchaseDate}"></div>
    <div class="field"><label>Trạng thái</label>
      <select id="f-status">
        <option value="ready" ${a.status==='ready'?'selected':''}>Sẵn sàng</option>
        <option value="broken" ${a.status==='broken'?'selected':''}>Hỏng</option>
        <option value="fixing" ${a.status==='fixing'?'selected':''}>Đang sửa</option>
      </select>
    </div>
    <div class="modal-actions">
      ${m.type==='edit' ? `<button class="btn danger" id="deleteBtn" style="margin-right:auto;">Xoá</button>` : ''}
      <button class="btn secondary" data-close>Huỷ</button>
      <button class="btn" id="saveBtn">Lưu</button>
    </div>
  </div>`;
}

function detailModal(a, isAdmin){
  const relatedReports = state.reports.filter(r=>r.assetId===a.id).sort((x,y)=>y.ts-x.ts);
  return `
  <div class="modal">
    <button class="close-x" data-close>×</button>
    <h2>${escHtml(a.name)}</h2>
    <p class="sub">${a.id}</p>
    <div class="detail-qr-wrap">
      <div class="qr-box" id="fullqr"></div>
      <div class="link">${assetLink(a.id)}</div>
    </div>
    <dl class="kv">
      <dt>Vị trí</dt><dd>${escHtml(a.location)}</dd>
      <dt>Ngày mua</dt><dd>${a.purchaseDate}</dd>
      <dt>Trạng thái</dt><dd><span class="status-pill ${STATUS_META[a.status].cls}">${STATUS_META[a.status].label}</span></dd>
    </dl>
    ${isAdmin ? `
    <div class="modal-actions" style="justify-content:flex-start;margin-bottom:18px;">
      <button class="btn secondary" id="editBtn">Sửa thông tin</button>
      <button class="btn secondary" id="printBtn">In mã QR</button>
    </div>` : `
    <div class="modal-actions" style="justify-content:flex-start;margin-bottom:18px;">
      <button class="btn" id="reportBtn">🚩 Báo hỏng thiết bị này</button>
    </div>`}
    ${relatedReports.length>0 ? `
    <p class="sub" style="margin-top:8px;">LỊCH SỬ BÁO HỎNG (${relatedReports.length})</p>
    ${relatedReports.map(r=>`
      <div class="report-item">
        <div class="meta">${new Date(r.ts).toLocaleString('vi-VN')} · ${escHtml(r.reporter||'Ẩn danh')} · <span class="${r.status==='new'?'badge-new':'badge-done'}">${r.status==='new'?'MỚI':'ĐÃ XỬ LÝ'}</span></div>
        ${escHtml(r.description)}
        ${r.photo?`<img src="${r.photo}">`:''}
      </div>
    `).join('')}` : ''}
  </div>`;
}

function pickScanModal(){
  return `
  <div class="modal">
    <button class="close-x" data-close>×</button>
    <h2>Mô phỏng quét QR</h2>
    <p class="sub">Chọn thiết bị để giả lập việc quét mã bằng điện thoại</p>
    <div class="hint">Trong triển khai thực tế, người dùng dùng camera điện thoại quét mã QR dán trên thiết bị và được đưa thẳng tới màn hình này.</div>
    <div class="field"><label>Chọn thiết bị</label>
      <select id="scanPick">
        ${state.assets.map(a=>`<option value="${a.id}">${a.id} — ${escHtml(a.name)}</option>`).join('')}
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" data-close>Huỷ</button>
      <button class="btn" id="goScanBtn">Xem thiết bị</button>
    </div>

}

function reportFormModal(a){
  return `
  <div class="modal">
    <button class="close-x" data-close>×</button>
    <h2>Báo cáo hỏng hóc</h2>
    <p class="sub">${a.id} — ${escHtml(a.name)}</p>
    <div class="field"><label>Họ tên người báo cáo</label><input type="text" id="r-name" placeholder="VD: Nguyễn Văn A"></div>
    <div class="field"><label>Mô tả sự cố</label><textarea id="r-desc" placeholder="Mô tả hiện tượng hỏng hóc..."></textarea></div>
    <div class="field"><label>Ảnh chụp (không bắt buộc)</label>
      <div class="file-drop" id="fileDrop">
        <span id="fileDropLabel">Bấm để chọn ảnh</span>
        <input type="file" id="r-photo" accept="image/*" style="display:none;">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" data-close>Huỷ</button>
      <button class="btn" id="submitReportBtn">Gửi báo cáo</button>

/* ---------------- MODAL EVENT BINDING ---------------- */
function bindModalEvents(m){
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ state.modal=null; render(); });

  if(m.type==='add' || m.type==='edit'){
    document.getElementById('saveBtn').onclick = async ()=>{
      const id = document.getElementById('f-id').value.trim();
      const name = document.getElementById('f-name').value.trim();
      const location = document.getElementById('f-location').value.trim();
      const purchaseDate = document.getElementById('f-date').value;
      const status = document.getElementById('f-status').value;
      if(!name || !location){ alert('Vui lòng nhập đầy đủ tên và vị trí thiết bị.'); return; }
      if(m.type==='add'){
        state.assets.push({id, name, location, purchaseDate, status});
      } else {
        const a = state.assets.find(x=>x.id===m.data.id);
        Object.assign(a, {name, location, purchaseDate, status});
      }
      await saveAssets();
      state.modal=null; render();
    };
    const delBtn = document.getElementById('deleteBtn');
    if(delBtn) delBtn.onclick = async ()=>{
      if(confirm('Xoá thiết bị này? Hành động không thể hoàn tác.')){
        state.assets = state.assets.filter(x=>x.id!==m.data.id);
        await saveAssets();
        state.modal=null; render();
      }
    };
  }

  if(m.type==='detail' || m.type==='view'){
    const qrEl = document.getElementById('fullqr');
    if(qrEl) new QRCode(qrEl, {text: assetLink(m.data.id), width:160, height:160, correctLevel: QRCode.CorrectLevel.M});
    const editBtn = document.getElementById('editBtn');
    if(editBtn) editBtn.onclick = ()=>{ state.modal={type:'edit', data:m.data}; render(); };
    const printBtn = document.getElementById('printBtn');
    if(printBtn) printBtn.onclick = ()=>{
      const w = window.open('', '_blank');
      w.document.write(`<html><head><title>In tem QR - ${m.data.id}</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
        <style>body{font-family:sans-serif;text-align:center;padding:30px;} .tag{display:inline-block;border:1px dashed #999;padding:16px 22px;border-radius:8px;}</style>
        </head><body>
        <div class="tag">
          <div id="p"></div>
          <h3 style="margin:10px 0 2px;">${escHtml(m.data.id)}</h3>
          <p style="margin:0;font-size:13px;">${escHtml(m.data.name)}</p>
          <p style="margin:2px 0 0;font-size:11px;color:#666;">${escHtml(m.data.location)}</p>
        </div>
        <script>
          window.onload = function(){
            new QRCode(document.getElementById('p'), {text:"${assetLink(m.data.id)}", width:180, height:180});
            setTimeout(function(){ window.print(); }, 300);
          };
        <\/script>
        </body></html>`);
      w.document.close();
    };
    const reportBtn = document.getElementById('reportBtn');
    if(reportBtn) reportBtn.onclick = ()=>{ state.modal={type:'report', data:m.data}; render(); };
  }

  if(m.type==='pickscan'){
    document.getElementById('goScanBtn').onclick = ()=>{
      const id = document.getElementById('scanPick').value;
      const a = state.assets.find(x=>x.id===id);
      state.modal = {type:'view', data:a};
      render();
    };
  }

  if(m.type==='report'){
    let photoData = null;
    const drop = document.getElementById('fileDrop');
    const input = document.getElementById('r-photo');
    drop.onclick = ()=>input.click();
    input.onchange = ()=>{
      const file = input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        photoData = reader.result;
        document.getElementById('fileDropLabel').innerHTML = `Đã chọn: ${escHtml(file.name)}<br><img src="${photoData}">`;
      };
      reader.readAsDataURL(file);
    };
    document.getElementById('submitReportBtn').onclick = async ()=>{
      const desc = document.getElementById('r-desc').value.trim();
      if(!desc){ alert('Vui lòng mô tả sự cố.'); return; }
      const reporter = document.getElementById('r-name').value.trim();
      const report = {id: uid('R-'), assetId: m.data.id, description: desc, reporter, photo: photoData, ts: Date.now(), status:'new'};
      state.reports.push(report);
      await saveReports();
      alert('Đã gửi báo cáo hỏng hóc. Cảm ơn bạn!');
      state.modal=null; render();
    };
  }
}

/* ---------------- UTIL ---------------- */
function escHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s){ return escHtml(s); }

/* ---------------- DEEP LINK ON LOAD ---------------- */
function checkDeepLink(){
  const params = new URLSearchParams(location.search);
  const assetId = params.get('asset');
  if(assetId){
    const a = state.assets.find(x=>x.id===assetId);
    if(a){ state.role='user'; state.modal={type:'view', data:a}; }
  }
}

init().then(()=>{ checkDeepLink(); render(); });
